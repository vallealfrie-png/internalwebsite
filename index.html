<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Auth Modal</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #081b29;
            --main-color: #00eeff;
            --text-color: #fff;
            --panel-bg: #0d283d;
            --input-bg: rgba(255, 255, 255, 0.05);
            --neon: #00eeff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg-color);
            overflow: hidden;
        }

        /* Container Card */
        .wrapper {
            position: relative;
            width: 750px;
            height: 480px;
            background: var(--panel-bg);
            border: 2px solid var(--neon);
            box-shadow: 0 0 25px rgba(0, 238, 255, 0.3);
            border-radius: 20px;
            overflow: hidden;
        }

        /* Form Box Mechanics */
        .form-box {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px;
            background: var(--panel-bg);
            /* Hardware-accelerated sliding & opacity balance */
            transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55), 
                        opacity 0.4s ease-in-out;
            will-change: transform, opacity;
        }

        /* Login Side Default State */
        .form-box.login {
            left: 0;
            z-index: 1;
            opacity: 1;
            pointer-events: auto;
        }

        .wrapper.active .form-box.login {
            transform: translateX(-110%);
            opacity: 0;
            z-index: 0;
            pointer-events: none; /* Prevents hidden input focusing */
        }

        /* Register Side Default State */
        .form-box.register {
            right: 0;
            transform: translateX(110%);
            opacity: 0;
            z-index: 0;
            pointer-events: none;
        }

        .wrapper.active .form-box.register {
            transform: translateX(0);
            opacity: 1;
            z-index: 1;
            pointer-events: auto;
        }

        /* Form Elements */
        h2 {
            font-size: 32px;
            color: var(--text-color);
            text-align: center;
            margin-bottom: 20px;
        }

        .input-box {
            position: relative;
            width: 100%;
            height: 50px;
            margin: 15px 0;
        }

        .input-box input {
            width: 100%;
            height: 100%;
            background: var(--input-bg);
            border: 2px solid rgba(255, 255, 255, 0.1);
            outline: none;
            border-radius: 10px;
            font-size: 16px;
            color: var(--text-color);
            padding: 0 45px 0 20px;
            transition: border-color 0.3s ease;
        }

        .input-box input:focus,
        .input-box input:valid {
            border-color: var(--neon);
        }

        .input-box i {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: rgba(255, 255, 255, 0.5);
            transition: color 0.3s ease;
        }

        .input-box input:focus ~ i,
        .input-box input:valid ~ i {
            color: var(--neon);
        }

        .btn {
            width: 100%;
            height: 45px;
            background: var(--neon);
            border: none;
            outline: none;
            border-radius: 10px;
            box-shadow: 0 0 10px var(--neon);
            cursor: pointer;
            font-size: 16px;
            color: var(--bg-color);
            font-weight: 600;
            margin-top: 10px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* Overlay Sliding Overlay Panel */
        .toggle-panel {
            position: absolute;
            top: 0;
            left: 50%;
            width: 50%;
            height: 100%;
            background: linear-gradient(135deg, #001f3f, #081b29);
            border-left: 2px solid var(--neon);
            box-shadow: -10px 0 25px rgba(0, 238, 255, 0.2);
            /* Fluid exponential slide movement */
            transition: transform 0.6s cubic-bezier(0.77, 0, 0.175, 1);
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
            will-change: transform;
        }

        .wrapper.active .toggle-panel {
            transform: translateX(-100%);
            border-left: none;
            border-right: 2px solid var(--neon);
            box-shadow: 10px 0 25px rgba(0, 238, 255, 0.2);
        }

        .toggle-panel h1 {
            font-size: 28px;
            color: var(--text-color);
            margin-bottom: 10px;
        }

        .toggle-panel p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 20px;
        }

        .toggle-panel .btn-outline {
            width: 160px;
            height: 40px;
            background: transparent;
            border: 2px solid var(--neon);
            color: var(--neon);
            box-shadow: none;
        }

        .toggle-panel .btn-outline:hover {
            background: var(--neon);
            color: var(--bg-color);
            box-shadow: 0 0 10px var(--neon);
        }

        /* Panel Content Cross-Fade Toggle */
        .toggle-text {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: opacity 0.3s ease, transform 0.4s ease;
        }

        .toggle-text.register-prompt {
            opacity: 1;
            transform: scale(1);
        }

        .toggle-text.login-prompt {
            opacity: 0;
            transform: scale(0.9);
            pointer-events: none;
        }

        .wrapper.active .toggle-text.register-prompt {
            opacity: 0;
            transform: scale(0.9);
            pointer-events: none;
        }

        .wrapper.active .toggle-text.login-prompt {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <div class="wrapper" id="main-wrapper">
        <!-- LOGIN FORM -->
        <div class="form-box login">
            <form onsubmit="handleAuth(event, 'login')">
                <h2>Login</h2>
                <div class="input-box">
                    <input type="email" id="login-email" required>
                    <i class="fa-solid fa-envelope"></i>
                </div>
                <div class="input-box">
                    <input type="password" id="login-password" required>
                    <i class="fa-solid fa-lock"></i>
                </div>
                <button type="submit" class="btn">Sign In</button>
            </form>
        </div>

        <!-- REGISTER FORM -->
        <div class="form-box register">
            <form onsubmit="handleAuth(event, 'register')">
                <h2>Registration</h2>
                <div class="input-box">
                    <input type="text" id="reg-name" required>
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="input-box">
                    <input type="email" id="reg-email" required>
                    <i class="fa-solid fa-envelope"></i>
                </div>
                <div class="input-box">
                    <input type="password" id="reg-password" required>
                    <i class="fa-solid fa-lock"></i>
                </div>
                <button type="submit" class="btn">Sign Up</button>
            </form>
        </div>

        <!-- SLIDING OVERLAY PANEL -->
        <div class="toggle-panel">
            <div class="toggle-text register-prompt">
                <h1>Hello, Friend!</h1>
                <p>Register with your personal details to use all of site features</p>
                <button class="btn btn-outline" onclick="toggleView(true)">Sign Up</button>
            </div>
            <div class="toggle-text login-prompt">
                <h1>Welcome Back!</h1>
                <p>Enter your personal details to use all of site features</p>
                <button class="btn btn-outline" onclick="toggleView(false)">Sign In</button>
            </div>
        </div>
    </div>

    <script>
        const wrapper = document.getElementById('main-wrapper');

        // Handles view sliding state toggle safely
        function toggleView(isRegister) {
            if (isRegister) {
                wrapper.classList.add('active');
            } else {
                wrapper.classList.remove('active');
            }
        }

        // Mock auth submission handler
        function handleAuth(event, mode) {
            event.preventDefault();
            if (mode === 'login') {
                const email = document.getElementById('login-email').value;
                console.log('Logging in user:', email);
            } else {
                const name = document.getElementById('reg-name').value;
                const email = document.getElementById('reg-email').value;
                console.log('Registering user:', name, email);
            }
        }
    </script>
</body>
</html>
